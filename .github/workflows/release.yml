name: Build and release

# Push a tag like v1.0.1 and this builds the .exe and publishes the release,
# which is what the app's auto-updater looks at. Run it manually
# (Actions -> Build and release -> Run workflow) to get a test build without
# publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The updater compares the running __version__ to the release tag, so a
      # mismatch would ship a build that never sees itself as out of date.
      - name: Check the tag matches version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import version; print(version.__version__)")
          echo "tag=$TAG  version.py=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG does not match version.py ($VER) — bump version.py first."
            exit 1
          fi

      - name: Build the exe
        run: pyinstaller --noconfirm GlassesValidator.spec

      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\GlassesValidator.exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Write-Error "The exe exited immediately with code $($p.ExitCode)"
            exit 1
          }
          $p | Stop-Process -Force
          Write-Output "exe launched and stayed running"

      # Always available, so a manual run still gives you something to download.
      - uses: actions/upload-artifact@v4
        with:
          name: GlassesValidator-exe
          path: dist/GlassesValidator.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          NOTES=$(cat <<'EOF'
          **Download `GlassesValidator.exe` below and run it — nothing to install.**

          Already running an older version? It will offer the update itself on next launch.

          First run: Windows SmartScreen shows an "unknown publisher" warning (the exe is
          unsigned) — choose *More info* → *Run anyway*. The first launch takes ~30–60 s
          while the reference data downloads; later launches are ~1 s.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing the asset"
            gh release upload "$TAG" dist/GlassesValidator.exe --clobber
          else
            gh release create "$TAG" dist/GlassesValidator.exe \
              --title "$TAG" --notes "$NOTES"
          fi
